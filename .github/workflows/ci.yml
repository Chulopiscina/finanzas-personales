name: Verify finance application
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: finanzas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-disposable@localhost:5432/finanzas_test?schema=app
      DIRECT_URL: postgresql://postgres:ci-only-disposable@localhost:5432/finanzas_test?schema=app
      TEST_DATABASE_URL: postgresql://postgres:ci-only-disposable@localhost:5432/finanzas_test?schema=app
      AUTH_SECRET: ci-only-disposable-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run vercel-build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:system
