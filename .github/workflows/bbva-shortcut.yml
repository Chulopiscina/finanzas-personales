name: Build universal banking shortcut and check Apple signing

on:
  push:
    branches: [main]
    paths:
      - shortcuts/FinanzasBancarias.cherri
      - scripts/verify-shortcut.py
      - scripts/shortcut_structure.py
      - scripts/build-universal-shortcut.mjs
      - .github/workflows/bbva-shortcut.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    # Standard runner: free for this public repository. No financial credentials.
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.9'
          cache: false
      - name: Build pinned compiler without third-party signing
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/electrikmilk/cherri.git "$RUNNER_TEMP/cherri"
          git -C "$RUNNER_TEMP/cherri" checkout bcc0095754e2cc0baaeb4d93dae172b8153b4716
          cd "$RUNNER_TEMP/cherri"
          go build -o "$RUNNER_TEMP/cherri-compiler" .
      - name: Compile, inspect and sign with Apple's native command
        id: apple
        shell: bash
        run: |
          set -euo pipefail
          cp shortcuts/FinanzasBancarias.cherri "$RUNNER_TEMP/FinanzasBancarias.cherri"
          "$RUNNER_TEMP/cherri-compiler" "$RUNNER_TEMP/FinanzasBancarias.cherri" --skip-sign
          python3 scripts/verify-shortcut.py "$RUNNER_TEMP/Finanzas Bancarias_unsigned.shortcut"
          plutil -convert binary1 "$RUNNER_TEMP/Finanzas Bancarias_unsigned.shortcut"
          mkdir -p "$RUNNER_TEMP/signed"
          if ! shortcuts sign --mode anyone --input "$RUNNER_TEMP/Finanzas Bancarias_unsigned.shortcut" --output "$RUNNER_TEMP/signed/Finanzas Bancarias.shortcut" > "$RUNNER_TEMP/sign.log" 2>&1; then
            cat "$RUNNER_TEMP/sign.log"
            if grep -q 'must be signed into iCloud' "$RUNNER_TEMP/sign.log"; then
              echo 'signed=false' >> "$GITHUB_OUTPUT"
              echo '::warning::Apple requires an iCloud session. Native compilation passed; no installable file or release has been published.'
              echo 'Apple signing BLOCKED: a maintainer must sign on a Mac logged into iCloud. No credentials are requested or stored by this workflow.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi
          test -s "$RUNNER_TEMP/signed/Finanzas Bancarias.shortcut"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP/signed"
          shasum -a 256 "Finanzas Bancarias.shortcut" > SHA256SUMS
      - name: Publish immutable signed file
        if: steps.apple.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: universal-shortcut-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Finanzas Bancarias (iOS 27)" --notes "Native Apple signing completed by CI. Physical iPhone installation and notification acceptance tests for each bank remain separate. No user credentials are included." "$RUNNER_TEMP/signed/Finanzas Bancarias.shortcut" "$RUNNER_TEMP/signed/SHA256SUMS"
